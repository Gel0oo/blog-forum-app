<!-- web/index.html -->
<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <title>Postly</title>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <script>
    (function() {
      var saved = localStorage.getItem('theme_mode');
      var isDark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.setProperty('--bg', isDark ? '#16191c' : '#ffffff');
      document.documentElement.style.setProperty('--dot', isDark ? '#6366f1' : '#4f46e5');
    })();
  </script>

  <style>
    html,
    body,
    flutter-view,
    flt-glass-pane {
      background-color: var(--bg) !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .dots-loader {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      background-color: var(--dot);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }
  </style>
</head>

<body>
  <div class="dots-loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
